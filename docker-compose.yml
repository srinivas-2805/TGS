services:
  postgres:
    image: postgres:15-alpine
    container_name: tgs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tgs_school}
      POSTGRES_USER: ${DB_USERNAME:-tgs_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tgs_dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - tgs_pgdata:/var/lib/postgresql/data

volumes:
  tgs_pgdata:
