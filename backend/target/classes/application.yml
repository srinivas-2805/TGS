server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: tgs-school-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tgs_school}
    username: ${DB_USERNAME:tgs_admin}
    password: ${DB_PASSWORD:tgs_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE_MB:10}MB
      max-request-size: ${STORAGE_MAX_FILE_SIZE_MB:10}MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-override-in-env-with-256-bit-random-secret-key-telangana-grammar-school}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  storage:
    provider: ${STORAGE_PROVIDER:LOCAL}
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
    max-file-size-mb: ${STORAGE_MAX_FILE_SIZE_MB:10}
    s3-bucket: ${S3_BUCKET:}
    s3-region: ${S3_REGION:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@tgs-kalluru.example.edu.in}
  sms:
    provider: ${SMS_PROVIDER:LOG_ONLY}
    api-key: ${SMS_API_KEY:}
    sender-id: ${SMS_SENDER_ID:TGSSCH}
    api-url: ${SMS_API_URL:}
  payment:
    provider: ${PAYMENT_GATEWAY_PROVIDER:MANUAL_ONLY}
    key-id: ${PAYMENT_GATEWAY_KEY_ID:}
    key-secret: ${PAYMENT_GATEWAY_KEY_SECRET:}
    webhook-secret: ${PAYMENT_GATEWAY_WEBHOOK_SECRET:}
  seed:
    demo-data: ${APP_SEED_DEMO_DATA:true}
  library:
    late-fee-per-day: ${SCHOOL_LATE_FEE_PER_DAY:5}
